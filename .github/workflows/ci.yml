# Continuous integration gates — Master Reference v1.0 §11.8.
#
# A pull request cannot merge unless every gate here passes. Four of the seven
# gates in §11.8 exist today; the other three need directories that Phase One
# creates, and each is listed at the bottom of this file with the condition
# that turns it on. Adding a gate late is how the defects this project has
# already found get re-introduced, so they are named here rather than
# remembered.
name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches render.yaml's PYTHON_VERSION pin. Upgrades are deliberate,
          # not incidental (§11.1).
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        # The suite is SQLite-only by architecture: tests/conftest.py builds a
        # throwaway per-test engine and ignores DATABASE_URL. Postgres is
        # exercised by the migrations job below, not here.
        run: python -m pytest -q

  migrations:
    name: Migrations forward and backward (PostgreSQL)
    runs-on: ubuntu-24.04
    # §11.6 requires every schema change to be a migration "run forward and
    # backward successfully", and §11.8 requires migrations to apply cleanly to
    # an empty database. Neither was verifiable before this job: no test
    # executes Alembic at all. This is a prerequisite for the version two
    # schema work, not Phase Three polish.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: silicaguard_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/silicaguard_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Upgrade to head on an empty database
        run: python -m alembic upgrade head
      - name: Downgrade to base
        run: python -m alembic downgrade base
      - name: Upgrade to head again
        run: python -m alembic upgrade head
      - name: Models match migrations (no un-migrated model drift)
        # autogenerate against a database already at head must produce an empty
        # migration. If it does not, db_models.py and alembic/versions/ have
        # diverged — the exact failure that silently ships a column no
        # migration creates.
        run: |
          python -m alembic revision --autogenerate -m "ci drift check" --rev-id ci_drift_check
          python - <<'PY'
          import pathlib, re, sys
          p = next(pathlib.Path("alembic/versions").glob("*ci_drift_check*.py"))
          body = p.read_text(encoding="utf-8")
          upgrade = body.split("def upgrade()")[1].split("def downgrade()")[0]
          ops = [l.strip() for l in upgrade.splitlines()
                 if l.strip().startswith("op.") and "# ###" not in l]
          p.unlink()
          if ops:
              print("db_models.py has drifted from the migrations:")
              print("\n".join("  " + o for o in ops))
              sys.exit(1)
          print("No drift: models and migrations agree.")
          PY

  clinical:
    name: Clinical specifications
    runs-on: ubuntu-24.04
    # 11.8's instrument gate. Checks the shape of every instrument file
    # against clinical/instrument.schema.json plus the cross-references a
    # schema cannot express: that rules only reference questions and
    # conditions that exist, that scores name answer values the question
    # actually offers, that every condition has a reachable baseline tier, and
    # that intervals cover every condition and tier. A typo in a rule
    # otherwise produces a rule that silently can never fire.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate instrument specifications
        run: python scripts/validate_instrument.py

  content:
    name: Content strings
    runs-on: ubuntu-24.04
    # 11.8's character set validator and channel budget check, over every
    # language. One character outside GSM 03.38 sends the whole message as
    # 16-bit at 70 characters per segment instead of 160, permanently
    # multiplying the cost of every send -- a failure invisible in review and
    # silent at runtime. The budget is checked per language because the local
    # language version is usually the longest, and a string that does not fit
    # is rewritten, never truncated at runtime.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate patient-facing content
        run: python scripts/validate_content.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    # §11.5: "a secret committed once is a secret rotated immediately". Cheaper
    # to block the commit.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependencies:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    # §11.8: any high severity finding blocks the merge.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - run: pip install pip-audit
      - name: pip-audit
        # Two advisories are suppressed below. Both are real, neither has a fix
        # version, and neither is exploitable in this configuration. Each is
        # suppressed individually, so any NEW advisory still blocks the merge,
        # and each carries the condition that would make it live again.
        #
        #   PYSEC-2026-4298  python-jose <=3.5.0. HMAC key confusion: a holder
        #     of the service public key can forge HS256 tokens WHEN THE CALLER
        #     DOES NOT RESTRICT ALGORITHMS. backend/routers/auth.py:29 passes
        #     algorithms=["HS256"] explicitly, which is the condition the
        #     advisory requires to be absent. Removing that argument makes this
        #     live -- do not.
        #
        #   PYSEC-2026-1325  ecdsa 0.19.2. Minerva timing attack on P-256
        #     signing. Pulled in transitively by python-jose[cryptography];
        #     imported nowhere in this codebase, and the tokens are HS256
        #     (symmetric), so no ECDSA signing happens. Upstream considers side
        #     channel attacks out of scope and has no planned fix.
        #
        # Revisit both if authentication ever moves to an asymmetric algorithm,
        # and drop the suppression the moment a fixed release exists.
        run: |
          python -m pip_audit --strict --desc -r backend/requirements.txt             --ignore-vuln PYSEC-2026-4298             --ignore-vuln PYSEC-2026-1325

# Gates from §11.8 still to wire, with the condition that turns each on
# (see docs/IMPLEMENTATION_PLAN.md):
#
#   Instrument regression     — when clinical/instruments/ holds a real
#                               instrument (Phase One 1.4). Fixed answer
#                               profiles with Clinical Lead-approved expected
#                               tiers, run against every instrument version, so
#                               a clinical change that moves an unrelated tier
#                               is caught (§11.7). The fixture format is
#                               <CODE>-v<N>.fixtures.yaml beside the spec.
#
# Also planned, not in §11.8's list but required by the same reasoning:
#   Channel equivalence       — identical answers through both channels must
#                               produce identical result rows (§10.1).
#   No model string on a
#   patient-facing field      — enforces §8.4 in code rather than by review.
#
# The character set validator, the channel budget check and the instrument
# shape check are live above as the `content` and `clinical` jobs.
