# Render Blueprint for the SilicaGuard backend. Connect this repo on
# Render and it should offer to use this file automatically (New -> Blueprint).
#
# Storage: Postgres via Supabase (Step B, 15-16 August 2026) is the database
# of record now — persistent across redeploys/sleep-wakes, unlike the old
# SQLite-on-ephemeral-disk setup this comment used to describe. Set
# DATABASE_URL in the Render dashboard (sync: false below — never commit a
# real connection string here) to the Supabase Session Pooler URL, with
# "+psycopg" added to the scheme, e.g.
# postgresql+psycopg://user:pass@aws-0-<region>.pooler.supabase.com:5432/postgres
# — the Session Pooler specifically, not "Direct connection" (IPv6-only,
# Render's free tier can't reliably reach it) or "Transaction pooler" (breaks
# SQLAlchemy's use of session-level features). AUTO_SEED_ON_BOOT is false
# below accordingly — data now survives restarts, so wiping it on every boot
# would destroy real referral-code confirmations and screenings between
# rehearsals. Re-seed manually (scripts/seed_demo_data.py) when you actually
# want a known-good reset.
services:
  - type: web
    name: silicaguard-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # MIGRATIONS RUN BEFORE THE SERVER STARTS, as of 2 November 2026.
    #
    # They did not, and that broke production. The Phase One rebuild merged
    # and this service came up with the new TABLES but none of the new
    # COLUMNS on `referrals` and `screening_answers`, because boot calls
    # `init_db()` -> `Base.metadata.create_all()`, which creates a missing
    # table and can never add a missing column to one that already exists.
    # Every query selecting those models then failed: the hospital-facing
    # referral lookup and the dashboard's day numbers both returned 500,
    # while /api/health reported `database: up` — which was true, and told
    # nobody anything.
    #
    # `&&` rather than `;` on purpose: if the migration fails, the server
    # must not start against a schema it cannot use. That is the one place
    # where refusing to boot beats booting degraded, because the alternative
    # is exactly the silent half-migrated state that caused the outage.
    #
    # WARNING, and the reason this is a comment as much as a change: THIS
    # FILE DOES NOT GOVERN THE LIVE SERVICE. It was created through Render's
    # REST API and never Blueprint-synced, so editing it changes nothing by
    # itself — the start command has to be set on the service as well. See
    # CLAUDE.md's deployment notes. This records the intended command so that
    # whoever re-syncs or rebuilds the service gets it right.
    # `scripts/start.py` rather than `alembic upgrade head && uvicorn`, and
    # the difference matters on a free tier. A wake restarts the container and
    # re-runs this command; the free Supabase project pauses after seven idle
    # days, twice so far. With `&&`, a wake while the database is paused means
    # the migration fails and uvicorn never starts -- no process, no
    # /api/health, nothing from outside to say whether the API or the database
    # is the problem. That is the outage PR #27 was written to prevent.
    #
    # The script tells the two failures apart, because they want opposite
    # responses: a database it cannot reach means serve anyway and let
    # /api/health report it, while a migration that actually fails means
    # refuse to start rather than serve a schema the code cannot use.
    #
    # Render's preDeployCommand would be the right mechanism and is not
    # available on the free plan.
    startCommand: python scripts/start.py
    envVars:
      # Pinned 16 August 2026 after a Render build silently landed on Python
      # 3.14.3 (a release barely out) with no version specified anywhere in
      # this file — real risk that a C-extension package (psycopg, coming
      # with the Postgres/Supabase cutover) has no prebuilt wheel yet for
      # that new a version, turning a transient build hiccup into a
      # recurring one this close to feature freeze. Matches local dev's
      # venv (3.12.3) for reproducibility.
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        value: sandbox
      - key: HOSPITAL_NURSE_PHONE
        sync: false
      # Supabase Postgres connection string — set manually in the Render
      # dashboard (sync: false, see the file-header comment above for the
      # exact format). Not given a `value:` here on purpose, unlike before
      # Step B: a real DB URL with a password has no business in this
      # committed file.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: HOSPITAL_EMAIL
        sync: false
      - key: HOSPITAL_PASSWORD
        sync: false
      - key: CIMAS_EMAIL
        sync: false
      - key: CIMAS_PASSWORD
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "10"
      - key: AUTO_SEED_ON_BOOT
        value: "false"
