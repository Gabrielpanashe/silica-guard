# Render Blueprint for the SilicaGuard backend. Connect this repo on
# Render and it should offer to use this file automatically (New -> Blueprint).
#
# Storage: Render's free tier has no persistent disk, so the SQLite file
# resets on every redeploy/sleep-wake cycle. AUTO_SEED_ON_BOOT=true below
# re-runs backend/scripts/seed_demo_data.py on every boot so the deployed
# instance always has known-good demo data rather than an empty DB —
# accepted for the 11 August demo (see CLAUDE.md's sprint status for the
# full reasoning). Do not point this at a deployment carrying real data.
services:
  - type: web
    name: silicaguard-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pinned 16 August 2026 after a Render build silently landed on Python
      # 3.14.3 (a release barely out) with no version specified anywhere in
      # this file — real risk that a C-extension package (psycopg, coming
      # with the Postgres/Supabase cutover) has no prebuilt wheel yet for
      # that new a version, turning a transient build hiccup into a
      # recurring one this close to feature freeze. Matches local dev's
      # venv (3.12.3) for reproducibility.
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        value: sandbox
      - key: HOSPITAL_NURSE_PHONE
        sync: false
      # A full SQLAlchemy URL, not a bare file path (format changed 14 Aug
      # 2026 with the ORM migration). Still SQLite here until the Supabase
      # Postgres cutover (Step B) lands — see CLAUDE.md's sprint status.
      # Once it does, set this to the Supabase connection string in the
      # Render dashboard (sync: false — never commit a real one here).
      - key: DATABASE_URL
        value: sqlite:///./data/silicaguard.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: HOSPITAL_EMAIL
        sync: false
      - key: HOSPITAL_PASSWORD
        sync: false
      - key: CIMAS_EMAIL
        sync: false
      - key: CIMAS_PASSWORD
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "10"
      - key: AUTO_SEED_ON_BOOT
        value: "true"
